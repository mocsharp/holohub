---
# Required fields for packaging the application
# See https://docs.nvidia.com/holoscan/sdk-user-guide/cli/run_config.html#
application:
  title: Holohub - Cosmos Video Tokenize
  version: 1.0
  inputFormats: []
  outputFormats: ["screen"]

resources:
  cpu: 2
  gpu: 1
  memory: 1Gi
  gpuMemory: 1Gi

replayer:
  basename: "surgical_video"
  frame_rate: 120   # as specified in timestamps
  repeat: false    # default: false
  realtime: true  # default: false
  count: 0        # default: 0 (no frame count restriction)

holoviz:
  window_title: "Cosmos Video Tokenize"
  framerate: 120
  tensors:
    - name: "image"
      type: color

preprocessor:
  out_tensor_name: source_video
  out_dtype: "float32"
  scale_min: -1.0
  scale_max: 1.0
  resize_height: 480
  resize_width: 848

encoder:
  backend: trt
  model_file: encoder.onnx
  pre_processor_map:
    "cosmos_encoder": ["source_video"]
  inference_map:
    "cosmos_encoder": ["inference_output"]

decoder:
  backend: trt
  model_file: decoder.onnx
  pre_processor_map:
    "cosmos_decoder": ["inference_output"]
  inference_map:
    "cosmos_decoder": ["inference_output_decoder"]