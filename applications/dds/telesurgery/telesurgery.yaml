---
extensions:

application:
  title: Telesurgery with DDS
  version: 1.0
  inputFormats: []
  outputFormats: ["screen"]

# App: Surgeon
surgeon:
  scheduler:
    check_recession_period_ms: 0
    worker_thread_number: 2
    stop_on_deadlock: true
    stop_on_deadlock_timeout: 500
  video:
    domain_id: 0
    stream_id: 0
    participant_qos: "HoloscanDDSTransport::SHMEM+LAN"
    reader_qos: "HoloscanDDSDataFlow::Video"
  holoviz:
    window_title: "Telesurgery - Surgeon"
    width: 1024
    height: 576
    tensors:
      - name: ""
        type: color
        opacity: 1.0
        priority: 0
  hid:
    domain_id: 0
    participant_qos: HoloscanDDSTransport::SHMEM+LAN
    writer_qos: HoloscanDDSDataFlow::Command
    hid_devices:
      - name: joystick1
        path: /dev/input/js0
        type: joystick
      - name: keyboard1
        path: /dev/input/event4
        type: keyboard
      - name: mouse1
        path: /dev/input/event5
        type: mouse

robot:
  scheduler:
    check_recession_period_ms: 0
    worker_thread_number: 5
    stop_on_deadlock: true
    stop_on_deadlock_timeout: 500
  video:
    width: 1024
    height: 576
    device: /dev/video0
  hid:
    domain_id: 0
    participant_qos: "HoloscanDDSTransport::SHMEM+LAN"
    reader_qos: "HoloscanDDSDataFlow::Command"
    hid_device_filters:
      - /dev/input/js0
      - /dev/input/event4
      - /dev/input/event5
  holoviz:
    window_title: "Telesurgery - Robot"
    width: 1024
    height: 576
    enable_render_buffer_output: true
    tensors:
      - name: ""
        type: color
        opacity: 1.0
        priority: 0
      - name: joystick1
        type: crosses
        line_width: 2.0
        color: [0.0, 1.0, 0.0, 1.0]
        priority: 1
        opacity: 1.0
      - name: keyboard1
        type: ovals
        color: [0.5, 0.0, 1.0, 1.0]
        priority: 2
        line_width: 2.0
        opacity: 1.0
      - name: mouse1
        type: triangles
        color: [1.0, 0.0, 1.0, 1.0]
        line_width: 3.0
        point_size: 4.0
        priority: 3
  video_publisher:
    domain_id: 0
    stream_id: 0
    participant_qos: "HoloscanDDSTransport::SHMEM+LAN"
    writer_qos: "HoloscanDDSDataFlow::Video"


resources:
  cpu: 1
  gpu: 1
  memory: 1Gi
  gpuMemory: 1Gi



